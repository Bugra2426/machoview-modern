name: Native macOS build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  # Do not interrupt a version-tagged release with another run for that tag.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: ${{ matrix.runner }} / Universal build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            deployment: '15.0'
          - runner: macos-26
            deployment: '26.0'
    outputs:
      version: ${{ steps.version.outputs.version }}
    # These standard hosted labels are ARM64 (not the Intel or large labels).
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify native runner and toolchain
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$(sysctl -in sysctl.proc_translated 2>/dev/null || true)" != 1
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          sw_vers
          /bin/bash --version
          python3 -I scripts/check-project.py
          python3 -I -m unittest discover -s tests -p 'test_*.py' -v
          for script in scripts/*.sh; do bash -n "$script"; done
          plutil -lint Info.plist machoview.xcodeproj/project.pbxproj
          bash otool_disasm/tests/run-tests.sh

      - name: Set release version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=2.5.0
          if [[ "$REF_TYPE" == tag && "$REF_NAME" == v* ]]; then
            [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              printf 'Release tags must use vMAJOR.MINOR.PATCH\n' >&2
              exit 1
            }
            version="${REF_NAME#v}"
          fi
          printf 'RELEASE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build universal release
        run: |
          set -euo pipefail
          xcodebuild -project machoview.xcodeproj -scheme MachOView \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            'ARCHS=arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET=${{ matrix.deployment }} \
            MARKETING_VERSION="$RELEASE_VERSION" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual \
            build 2>&1 | tee build.log

      - name: Verify bundle and run native regression tests
        run: |
          set -euo pipefail
          app=build/DerivedData/Build/Products/Release/MachOView.app
          bash scripts/verify-app.sh "$app" universal
          # Run the ARM64 slice natively here; Intel runners test the same download below.
          # Also load a real universal static archive from the toolchain, if present.
          archive=$(ls "$(dirname "$(xcrun -f clang)")"/../lib/clang/*/lib/darwin/libclang_rt.osx.a 2>/dev/null | head -n 1 || true)
          export MV_SELFTEST_FILES="$archive"
          python3 -I - "$app/Contents/MacOS/MachOView" <<'PY'
          import subprocess, sys
          subprocess.run(['/usr/bin/arch', '-arm64', sys.argv[1], '--self-test'], check=True, timeout=900)
          PY

      - name: Show crash reports from the self-test
        if: failure()
        run: |
          for report in ~/Library/Logs/DiagnosticReports/MachOView*; do
            [ -f "$report" ] && { printf '===== %s\n' "$report"; head -c 200000 "$report"; }
          done
          true

      - name: Prepare DMG packaging tools
        run: |
          set -euo pipefail
          python3 -m venv build/packaging-venv
          build/packaging-venv/bin/python -m pip install --disable-pip-version-check \
            -r scripts/packaging-requirements.txt
          printf '%s/build/packaging-venv/bin\n' "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"

      - name: Package and verify DMG and ZIP
        run: |
          set -euo pipefail
          mkdir -p build/artifacts
          app=build/DerivedData/Build/Products/Release/MachOView.app
          name="MachOView-$RELEASE_VERSION-${{ matrix.runner }}-universal"
          bash scripts/package-dmg.sh "$app" "build/artifacts/$name.dmg" universal 2>&1 | tee packaging.log
          ditto -c -k --sequesterRsrc --keepParent "$app" "build/artifacts/$name.zip"
          (cd build/artifacts && shasum -a 256 ./*.dmg ./*.zip > SHA256SUMS.txt)

      - name: Upload native application
        uses: actions/upload-artifact@v4
        with:
          name: MachOView-${{ matrix.runner }}-universal
          path: build/artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build and packaging logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.runner }}
          path: |
            build.log
            packaging.log
          if-no-files-found: ignore

  test-intel:
    name: ${{ matrix.runner }} / Native Intel test
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            baseline: macos-15
          - runner: macos-26-intel
            baseline: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download the packaged universal app
        uses: actions/download-artifact@v4
        with:
          name: MachOView-${{ matrix.baseline }}-universal
          path: build/artifacts

      - name: Verify and test the shipped Intel slice without Rosetta
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          {
            test "$(uname -m)" = x86_64
            test "$(sysctl -in sysctl.proc_translated 2>/dev/null || true)" != 1
            sw_vers
            (cd build/artifacts && shasum -a 256 -c SHA256SUMS.txt)
            ditto -x -k "build/artifacts/MachOView-$RELEASE_VERSION-${{ matrix.baseline }}-universal.zip" build/intel-test
            app=build/intel-test/MachOView.app
            bash scripts/verify-app.sh "$app" universal
            python3 -I - "$app/Contents/MacOS/MachOView" <<'PY'
          import subprocess, sys
          subprocess.run(['/usr/bin/arch', '-x86_64', sys.argv[1], '--self-test'], check=True, timeout=900)
          PY
          } 2>&1 | tee intel-test.log

      - name: Show crash reports from the Intel self-test
        if: failure()
        run: |
          for report in ~/Library/Logs/DiagnosticReports/MachOView*; do
            [ -f "$report" ] && { printf '===== %s\n' "$report"; head -c 200000 "$report"; }
          done
          true

      - name: Upload Intel test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intel-test-log-${{ matrix.baseline }}
          path: intel-test.log
          if-no-files-found: ignore

  release:
    name: Publish tested downloads
    needs: [build, test-intel]
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download both tested DMG and ZIP artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: MachOView-*-universal
          path: release-artifacts

      - name: Publish stable release or default-branch preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: bash scripts/publish-release.sh release-artifacts dist
